<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --surface-2: #f0efec;
    --border: #e4e2dd;
    --text: #1b1b19;
    --muted: #6d6b65;
    --accent: #2f5bea;
    --accent-soft: #e8eefd;
    --good: #18794e;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211;
      --surface: #1c1c1a;
      --surface-2: #262623;
      --border: #33322f;
      --text: #ecebe7;
      --muted: #9b9991;
      --accent: #7c9cff;
      --accent-soft: #232b45;
      --good: #4cc38a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .bar { max-width: 1240px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: 18px; white-space: nowrap; cursor: pointer; }
  .brand span { color: var(--accent); }
  form.search { flex: 1 1 420px; display: flex; position: relative; }
  form.search input {
    width: 100%; padding: 12px 96px 12px 44px; font: inherit; font-size: 16px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  form.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  form.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  form.search button {
    position: absolute; right: 5px; top: 5px; bottom: 5px; padding: 0 18px; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
  }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }

  .modes { display: flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .modes button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap;
  }
  .modes button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  main { max-width: 1240px; margin: 0 auto; padding: 20px; }

  /* ---------- meta row ---------- */
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 32px; margin-bottom: 14px; }
  .summary { color: var(--muted); font-size: 14px; }
  .summary b { color: var(--text); font-weight: 600; }
  .pipeline { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .pipeline .stage { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
  .pipeline .stage.on { border-color: var(--accent); color: var(--accent); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); padding: 5px 12px; border-radius: 999px;
    font-size: 13px; cursor: pointer; color: var(--text);
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip small { color: inherit; opacity: .65; margin-left: 4px; }

  /* ---------- grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); gap: 16px; }
  .card { min-width: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .card .img { aspect-ratio: 1; background: #fff; position: relative; display: grid; place-items: center; overflow: hidden; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 10px; }
  .card .rank {
    position: absolute; top: 8px; left: 8px; background: rgba(20,20,20,.75); color: #fff;
    font-size: 11px; font-weight: 600; border-radius: 6px; padding: 1px 7px;
  }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; border-top: 1px solid var(--border); }
  .card .merchant { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .title { font-size: 14px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: end; gap: 6px; padding-top: 4px; }
  .price { font-weight: 700; font-size: 16px; }
  .src { display: flex; gap: 3px; }
  .src span { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
  .src span.hit { background: var(--accent-soft); color: var(--accent); }

  .noimg { color: var(--muted); font-size: 12px; }

  /* ---------- states ---------- */
  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty h2 { color: var(--text); font-size: 26px; letter-spacing: -.02em; margin: 0 0 8px; }
  .empty .chips { justify-content: center; margin-top: 22px; }
  .skeleton .img, .skeleton .line { background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  .skeleton .line { height: 12px; border-radius: 4px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .more { display: block; margin: 26px auto 0; padding: 10px 22px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 500; }
  .more:hover { border-color: var(--accent); }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  aside {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface);
    z-index: 21; transform: translateX(100%); transition: transform .25s ease; overflow-y: auto;
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
  }
  aside.open { transform: none; }
  aside .close { position: sticky; top: 0; align-self: flex-end; margin: 10px; border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; z-index: 1; }
  aside .hero { background: #fff; margin-top: -54px; aspect-ratio: 4/3; display: grid; place-items: center; }
  aside .hero img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 24px; }
  aside .content { padding: 22px 26px 32px; display: flex; flex-direction: column; gap: 16px; }
  aside h3 { margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: -.01em; }
  aside h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  aside p { margin: 0; color: var(--text); }
  aside .desc { color: var(--muted); font-size: 14px; white-space: pre-line; }
  .cta { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 999px; font-weight: 600; align-self: flex-start; }
  .trace { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .trace div { background: var(--surface-2); border-radius: 10px; padding: 10px; text-align: center; }
  .trace b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .trace small { color: var(--muted); font-size: 11px; }
  .trace .miss b { color: var(--muted); font-weight: 400; }

  @media (max-width: 640px) {
    .bar { padding: 12px 16px; }
    main { padding: 16px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    form.search { flex-basis: 100%; }
    .brand { flex: 1; }
    .modes { width: 100%; }
    .modes button { flex: 1; padding: 6px 4px; font-size: 12px; }
    .card .body { padding: 10px; }
    .card .title { font-size: 13px; }
    .trace { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand" id="home">Product<span>Search</span></div>
    <form class="search" id="form" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search products…  (press / to focus)" autocomplete="off" autofocus>
      <button type="submit">Search</button>
    </form>
    <div class="modes" id="modes" role="group" aria-label="Ranking stage">
      <button data-mode="rerank" title="BM25 + dense → RRF → cross-encoder rerank">Hybrid + Rerank</button>
      <button data-mode="rrf" title="Reciprocal rank fusion of BM25 and dense">RRF</button>
      <button data-mode="bm25" title="Keyword retrieval only">BM25</button>
      <button data-mode="dense" title="Embedding retrieval only">Dense</button>
    </div>
  </div>
</header>

<main>
  <div id="view"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>

<script>
const EXAMPLES = ["linen summer dress", "wireless earbuds", "cozy throw blanket", "running shoes women", "dog bandana", "mid century coffee table", "gold hoop earrings", "ford f150 window switch"];
const STAGE_LABEL = { rerank: "Rerank", rrf: "RRF", bm25: "BM25", dense: "Dense" };
const PAGE = 20;

const state = { q: "", mode: "rerank", data: null, shown: PAGE, merchant: null, status: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtPrice = (p) => p == null ? "" : "$" + (p >= 100 ? Math.round(p).toLocaleString() : p.toFixed(2));

function imgTag(r, cls = "") {
  if (!r.image) return `<span class="noimg">No image</span>`;
  const fb = r.image_fallback && r.image_fallback !== r.image ? r.image_fallback : "";
  return `<img class="${cls}" loading="lazy" alt="" src="${esc(r.image)}" data-fb="${esc(fb)}">`;
}

// Local image missing → try the remote URL once, then show a placeholder.
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName !== "IMG") return;
  if (img.dataset.fb) { img.src = img.dataset.fb; img.dataset.fb = ""; return; }
  img.replaceWith(Object.assign(document.createElement("span"), { className: "noimg", textContent: "No image" }));
}, true);

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll("#modes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === mode));
}

function syncUrl() {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.mode !== "rerank") p.set("mode", state.mode);
  history.replaceState(null, "", p.toString() ? "?" + p : location.pathname);
}

async function run() {
  syncUrl();
  if (!state.q) { renderHome(); return; }
  renderSkeleton();
  const ctrl = (run.ctrl?.abort(), run.ctrl = new AbortController());
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(state.q)}&mode=${state.mode}`, { signal: ctrl.signal });
    if (!res.ok) throw new Error(await res.text());
    state.data = await res.json();
    state.shown = PAGE;
    state.merchant = null;
    renderResults();
  } catch (e) {
    if (e.name !== "AbortError") $("#view").innerHTML = `<div class="empty"><h2>Something went wrong</h2><p>${esc(e.message).slice(0, 300)}</p></div>`;
  }
}

function exampleChips() {
  return `<div class="chips">${EXAMPLES.map((e) => `<button class="chip" data-q="${esc(e)}">${esc(e)}</button>`).join("")}</div>`;
}

function renderHome() {
  const s = state.status;
  $("#view").innerHTML = `<div class="empty">
    <h2>Search ${s ? s.products.toLocaleString() : ""} products</h2>
    <p>BM25 + dense retrieval → reciprocal rank fusion → cross-encoder rerank${s ? ` · running on ${esc(s.device.toUpperCase())}` : ""}</p>
    ${exampleChips()}
  </div>`;
}

function renderSkeleton() {
  $("#view").innerHTML = `<div class="meta"><span class="summary">Searching…</span></div>
    <div class="grid">${Array.from({ length: 10 }, () => `<div class="card skeleton"><div class="img"></div>
    <div class="body"><div class="line" style="width:40%"></div><div class="line"></div><div class="line" style="width:70%"></div></div></div>`).join("")}</div>`;
}

function renderResults() {
  const d = state.data;
  if (d.message || !d.results.length) {
    $("#view").innerHTML = `<div class="empty"><h2>No results for “${esc(d.query)}”</h2><p>${esc(d.message || "Try different words.")}</p>${exampleChips()}</div>`;
    return;
  }
  const all = d.results;
  const filtered = state.merchant ? all.filter((r) => r.merchant === state.merchant) : all;
  const shown = filtered.slice(0, state.shown);

  const counts = {};
  all.forEach((r) => { if (r.merchant) counts[r.merchant] = (counts[r.merchant] || 0) + 1; });
  const merchants = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10);

  const t = d.timings;
  const stages = [["bm25", `BM25 ${d.counts.bm25}`], ["dense", `Dense ${d.counts.dense}`], ["rrf", `RRF ${d.counts.rrf}`], ["rerank", `Rerank`]];
  const stageOn = { bm25: ["bm25"], dense: ["dense"], rrf: ["bm25", "dense", "rrf"], rerank: ["bm25", "dense", "rrf", "rerank"] }[d.mode];

  $("#view").innerHTML = `
    <div class="meta">
      <span class="summary"><b>${filtered.length}</b> results for “<b>${esc(d.query)}</b>” · ${t.total} ms</span>
      <span class="pipeline">${stages.map(([k, label], i) =>
        `${["", "+", "→", "→"][i]}<span class="stage ${stageOn.includes(k) ? "on" : ""}" title="${t[k]} ms">${label} · ${t[k]}ms</span>`).join(" ")}</span>
    </div>
    ${merchants.length > 1 ? `<div class="chips">
      <button class="chip" data-merchant="" aria-pressed="${!state.merchant}">All<small>${all.length}</small></button>
      ${merchants.map(([m, c]) => `<button class="chip" data-merchant="${esc(m)}" aria-pressed="${state.merchant === m}">${esc(m)}<small>${c}</small></button>`).join("")}
    </div>` : ""}
    <div class="grid">${shown.map((r) => card(r, all.indexOf(r) + 1)).join("")}</div>
    ${filtered.length > state.shown ? `<button class="more" id="more">Show more (${filtered.length - state.shown} left)</button>` : ""}`;
}

function card(r, rank) {
  const src = [["bm25", "KW"], ["dense", "SEM"]].map(([k, l]) =>
    `<span class="${r.ranks[k] ? "hit" : ""}" title="${STAGE_LABEL[k]} rank: ${r.ranks[k] ?? "not retrieved"}">${l}</span>`).join("");
  return `<button class="card" data-id="${esc(r.id)}">
    <div class="img">${imgTag(r)}<span class="rank">#${rank}</span></div>
    <div class="body">
      <div class="merchant">${esc(r.merchant)}</div>
      <div class="title">${esc(r.title)}</div>
      <div class="foot"><span class="price">${fmtPrice(r.price)}</span><span class="src">${src}</span></div>
    </div>
  </button>`;
}

function openDrawer(id) {
  const r = state.data.results.find((x) => x.id === id);
  if (!r) return;
  const trace = ["bm25", "dense", "rrf", "rerank"].map((k) =>
    `<div class="${r.ranks[k] ? "" : "miss"}"><b>${r.ranks[k] ? "#" + r.ranks[k] : "—"}</b><small>${STAGE_LABEL[k]}</small></div>`).join("");
  $("#drawer").innerHTML = `
    <button class="close" id="close" aria-label="Close">×</button>
    <div class="hero">${imgTag(r)}</div>
    <div class="content">
      <div><h4>${esc(r.merchant)}</h4><h3>${esc(r.title)}</h3></div>
      ${r.price != null ? `<div class="price" style="font-size:22px">${fmtPrice(r.price)}</div>` : ""}
      ${r.url ? `<a class="cta" href="${esc(r.url)}" target="_blank" rel="noopener">View at ${esc(r.merchant || "store")} ↗</a>` : ""}
      <div><h4>Pipeline trace</h4><div class="trace">${trace}</div></div>
      ${r.ai_description ? `<div><h4>Summary</h4><p>${esc(r.ai_description)}</p></div>` : ""}
      ${r.description && r.description !== "NA" ? `<div><h4>Listing description</h4><p class="desc">${esc(r.description)}</p></div>` : ""}
      <div class="desc" style="font-size:12px">Product ID ${esc(r.id)}</div>
    </div>`;
  $("#drawer").classList.add("open");
  $("#drawer").setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("open");
  $("#drawer").scrollTop = 0;
}

function closeDrawer() {
  $("#drawer").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("open");
}

// ---------- events ----------
$("#form").addEventListener("submit", (e) => { e.preventDefault(); state.q = $("#q").value.trim(); $("#q").blur(); run(); });
$("#modes").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-mode]");
  if (!b || b.dataset.mode === state.mode) return;
  setMode(b.dataset.mode);
  run();
});
$("#home").addEventListener("click", () => { state.q = ""; $("#q").value = ""; run(); });
$("#view").addEventListener("click", (e) => {
  const chip = e.target.closest("[data-q]");
  if (chip) { state.q = chip.dataset.q; $("#q").value = state.q; run(); return; }
  const m = e.target.closest("[data-merchant]");
  if (m) { state.merchant = m.dataset.merchant || null; state.shown = PAGE; renderResults(); return; }
  if (e.target.id === "more") { state.shown += PAGE; renderResults(); return; }
  const c = e.target.closest(".card[data-id]");
  if (c) openDrawer(c.dataset.id);
});
$("#scrim").addEventListener("click", closeDrawer);
$("#drawer").addEventListener("click", (e) => { if (e.target.id === "close") closeDrawer(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
});

// ---------- init ----------
const params = new URLSearchParams(location.search);
state.q = params.get("q") || "";
setMode(["rerank", "rrf", "bm25", "dense"].includes(params.get("mode")) ? params.get("mode") : "rerank");
$("#q").value = state.q;
fetch("/api/status").then((r) => r.json()).then((s) => { state.status = s; if (!state.q) renderHome(); }).catch(() => {});
run();
</script>
</body>
</html>
